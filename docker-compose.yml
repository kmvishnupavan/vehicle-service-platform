# ==============================================================================
# Vehicle Service Platform - Docker Compose Orchestration
# Local / Staging multi-container topology with health checks and network isolation
# ==============================================================================

version: '3.8'

networks:
  platform-network:
    driver: bridge

services:
  # ----------------------------------------------------------------------------
  # Backend API Service (FastAPI ASGI)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vehicle-service-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-staging}
      - DEBUG=${DEBUG:-false}
      - HOST=0.0.0.0
      - PORT=8000
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:3000","http://localhost:5173","http://127.0.0.1:3000"]}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-}
      - PAYOUT_PROVIDER_MODE=sandbox
      - LIVE_PAYOUTS_ENABLED=false
      - OSRM_BASE_URL=${OSRM_BASE_URL:-http://router.project-osrm.org}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_CLAIM_EMAIL=${VAPID_CLAIM_EMAIL:-admin@vehiclecare.app}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
      - KILL_SWITCH_MATCHING_DISABLED=${KILL_SWITCH_MATCHING_DISABLED:-false}
      - KILL_SWITCH_NEW_BOOKINGS_DISABLED=${KILL_SWITCH_NEW_BOOKINGS_DISABLED:-false}
      - KILL_SWITCH_SCHEDULED_DISPATCH_DISABLED=${KILL_SWITCH_SCHEDULED_DISPATCH_DISABLED:-false}
      - KILL_SWITCH_NOTIFICATIONS_DISABLED=${KILL_SWITCH_NOTIFICATIONS_DISABLED:-false}
      - KILL_SWITCH_FORCE_ROUTING_FALLBACK=${KILL_SWITCH_FORCE_ROUTING_FALLBACK:-false}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - platform-network

  # ----------------------------------------------------------------------------
  # Frontend Client Service (React SPA served via Nginx)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_PUBLISHABLE_KEY=${VITE_SUPABASE_PUBLISHABLE_KEY}
        - VITE_VAPID_PUBLIC_KEY=${VITE_VAPID_PUBLIC_KEY:-}
    container_name: vehicle-service-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - platform-network

  # ----------------------------------------------------------------------------
  # Dedicated / Self-Hosted OSRM Service (Optional Production Profile)
  # Activated with: docker-compose --profile routing up -d
  # ----------------------------------------------------------------------------
  osrm:
    image: osrm/osrm-backend:latest
    container_name: vehicle-service-osrm
    restart: unless-stopped
    profiles:
      - routing
    ports:
      - "${OSRM_PORT:-5000}:5000"
    volumes:
      - ./data/osrm:/data:ro
    command: osrm-routed --algorithm mld /data/region.osrm
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/nearest/v1/driving/77.5946,12.9716"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - platform-network

