services:
  # ==============================================================================
  # Vehicle Service Platform - Backend FastAPI Web Service
  # ==============================================================================
  - type: web
    name: vehicle-service-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health/live
    envVars:
      - key: ENVIRONMENT
        value: development
      - key: DEBUG
        value: "false"
      - key: PROJECT_NAME
        value: Vehicle Service Platform API
      - key: API_V1_PREFIX
        value: /api/v1
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "8000"
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: SUPABASE_URL
        value: https://dfigtryvvujhwuiyzdvs.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_OZdsss6XPdfV3SLTqlKncw_BKqgJAMn
      - key: LIVE_PAYOUTS_ENABLED
        value: "false"
      - key: PAYOUT_PROVIDER_MODE
        value: sandbox
      - key: ROUTING_PROVIDER
        value: osrm
      - key: OSRM_BASE_URL
        value: http://router.project-osrm.org

  # ==============================================================================
  # Vehicle Service Platform - Frontend React SPA Static Site
  # ==============================================================================
  - type: web
    name: vehicle-service-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://vehicle-service-backend-kcfe.onrender.com/api/v1
      - key: VITE_SUPABASE_URL
        value: https://dfigtryvvujhwuiyzdvs.supabase.co
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_OZdsss6XPdfV3SLTqlKncw_BKqgJAMn
